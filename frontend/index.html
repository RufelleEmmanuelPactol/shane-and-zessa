<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // The invitation is drawn for a 390 px wide phone. On narrower phones
      // (360 px Androids, the 375 px iPhone SE and mini) lay it out at 390 and
      // let the browser shrink the whole page to fit, so every section scales together.
      (function () {
        var w = Math.min(screen.width, screen.height)
        if (w && w < 390) {
          document.querySelector('meta[name=viewport]').setAttribute('content', 'width=390, viewport-fit=cover')
        }
      })()
    </script>
    <title>Shane &amp; Zessa</title>
    <meta name="description" content="Shane and Zessa are getting married on November 29, 2026 in Sindangan, Zamboanga del Norte. Kindly let us know if you can join us." />
